name: tests

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  bundled-test:
    strategy:
      matrix:
        os: [
          macos-15
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Test bundled
        run: |
          brew list | grep gcc
          ls -l /opt/homebrew/opt/gcc/lib/gcc/15/libgfortran.5.dylib
          file /opt/homebrew/opt/gcc/lib/gcc/15/libgfortran.5.dylib
          # ls -l /opt/homebrew/opt/gcc/lib/gcc/current/libgfortran.5.dylib
          # file /opt/homebrew/opt/gcc/lib/gcc/current/libgfortran.5.dylib
          cargo b --features bundled --release
          cargo t --features bundled --release create
          cargo t --features bundled --release --examples
